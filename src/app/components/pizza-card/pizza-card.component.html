<article class="pizza-card" [class.pizza-card--in-cart]="isInCart()">
  <!-- Image Container -->
  <div class="pizza-card__image-wrapper">
    <img [src]="pizza.imageUrl" [alt]="pizza.name + ' pizza'" class="pizza-card__image" loading="lazy" />
    <!-- Veg/Non-Veg Badge -->
    <span class="pizza-card__badge" [class.pizza-card__badge--veg]="pizza.isVeg"
      [class.pizza-card__badge--non-veg]="!pizza.isVeg">
      <span class="pizza-card__badge-dot"></span>
      {{ pizza.isVeg ? 'Veg' : 'Non-Veg' }}
    </span>
    <!-- Price Tag -->
    <span class="pizza-card__price">₹{{ pizza.price.toFixed(2) }}</span>

    <!-- Added to Cart Overlay -->
    @if (justAdded()) {
    <div class="pizza-card__added-overlay">
      <div class="pizza-card__added-content">
        <svg class="pizza-card__added-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <polyline points="20 6 9 17 4 12" />
        </svg>
        <span>Added!</span>
      </div>
    </div>
    }
  </div>

  <!-- Content -->
  <div class="pizza-card__content">
    <h3 class="pizza-card__name">{{ pizza.name }}</h3>
    <p class="pizza-card__description">{{ pizza.description }}</p>

    <!-- Ingredients -->
    <div class="pizza-card__ingredients">
      @for (ingredient of pizza.ingredients; track ingredient) {
      <span class="pizza-card__ingredient">{{ ingredient }}</span>
      }
    </div>

    <!-- Add to Cart / Quantity Controls -->
    @if (isInCart()) {
    <div class="pizza-card__quantity-controls">
      <button class="pizza-card__qty-btn pizza-card__qty-btn--minus" (click)="decrementQuantity($event)"
        aria-label="Decrease quantity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
      <span class="pizza-card__qty-value">{{ quantity() }}</span>
      <button class="pizza-card__qty-btn pizza-card__qty-btn--plus" (click)="incrementQuantity($event)"
        aria-label="Add more with toppings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
    </div>
    } @else {
    <button class="pizza-card__btn" [class.pizza-card__btn--adding]="isAdding()" (click)="openToppingsModal()"
      [disabled]="isAdding()">
      <svg class="pizza-card__btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1" />
        <circle cx="20" cy="21" r="1" />
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
      </svg>
      <span>{{ isAdding() ? 'Adding...' : 'Add to Cart' }}</span>
    </button>
    }
  </div>
</article>
